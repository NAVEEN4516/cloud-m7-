[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-m7"
version = "0.1.0"
description = "Tier-Adaptive Forensic Provenance: Distributed Attack-Path Reconstruction across Edge, Fog, and Cloud"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "duckdb>=1.0",
]

[project.scripts]
cloud-m7 = "cloud_m7.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
demo = ["pytest>=7.0"]
